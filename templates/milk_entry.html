<!DOCTYPE html>
<html>

<head>

    <title>Milk Entry</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h2>Milk Entry</h2>

<form method="POST">

<label>Farmer ID</label>

<input type="text" name="farmer_id" required>

<label>Shift</label>

<select name="shift" required>

<option value="Morning">Morning</option>

<option value="Evening">Evening</option>

</select>

<br><br>

<label>Liters</label>

<input type="number"
step="0.1"
name="liters"
required>

<label>FAT</label>

<input type="number"
step="0.1"
name="fat"
required>

<label>SNF</label>

<input type="number"
step="0.1"
name="snf"
required>

<button type="submit">

Save Milk Entry

</button>

</form>

<p>{{ message }}</p>

</div>

</body>
</html>
